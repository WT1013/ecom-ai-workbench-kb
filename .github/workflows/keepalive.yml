name: 保活

# GitHub 对长期无提交的仓库会自动停用定时任务（约 60 天）。
# 这个 workflow 每月打一个空提交，保证「知识库同步」的定时一直有效。
on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 空提交
        run: |
          git config user.name "kb-bot"
          git config user.email "kb-bot@users.noreply.github.com"
          git commit --allow-empty -m "keepalive $(date -u +%Y-%m-%d)"
          git push
